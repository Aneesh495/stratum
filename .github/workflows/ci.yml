name: Stratum CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      boot_campaign:
        description: Run 45 fresh boots and 128 malformed boot cases
        type: boolean
        default: false
      storage_campaign:
        description: Run the 100-interruption StrataFS campaign
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build and VM dependencies
        timeout-minutes: 10
        run: |
          sources="$RUNNER_TEMP/stratum-ubuntu.list"
          cat > "$sources" <<'EOF'
          deb https://archive.ubuntu.com/ubuntu noble main universe
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb https://security.ubuntu.com/ubuntu noble-security main universe
          EOF
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-)
          apt_options+=(-o Acquire::Languages=none -o Acquire::Retries=2 -o Acquire::https::Timeout=25)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends clang lld libclang-rt-dev nasm qemu-system-x86 ovmf mtools
      - name: Check toolchain and documentation
        run: make doctor docs
      - name: Run sanitizer-enabled host tests
        run: make test fuzz
      - name: Build and exercise QEMU guests
        run: |
          make -j2 smoke
          make -j2 test-boot
          python3 scripts/test_diagnostics.py all
          python3 scripts/test_block_wrap.py
          python3 scripts/test_exec.py
      - name: Run the extended boot campaign
        if: github.event_name == 'workflow_dispatch' && inputs.boot_campaign
        run: python3 scripts/test_boot_campaign.py
      - name: Run the extended storage campaign
        if: github.event_name == 'workflow_dispatch' && inputs.storage_campaign
        run: python3 scripts/test_wal_crash.py --repeats 10
      - name: Preserve guest transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratum-guest-transcripts
          path: |
            build/**/*.log
            build/replication/*.pcap
            build/boot-campaign/*.json
            build/wal-crash-*/**/*.json
          if-no-files-found: ignore
